<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 390" role="img" aria-labelledby="pt pd">
  <title id="pt">plan-feature-into-tickets, phase by phase</title>
  <desc id="pd">In plan mode: Phase 1 brainstorms with you and three explorer agents and writes the spec. After your yes, Phase 2 has ticket-drafter write the tickets. Phase 3 shows you each ticket. After you approve, plan mode ends and Phase 4 creates the issues.</desc>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1d1a"/>
      <stop offset="1" stop-color="#141311"/>
    </linearGradient>
    <radialGradient id="pglow">
      <stop offset="0" stop-color="#ffb08f"/>
      <stop offset=".45" stop-color="#d97757"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a554d"/>
    </marker>
    <style>
      .h { font: 700 26px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f4ee; }
      .p { font: 400 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #a8a397; }
      .stage { font: 600 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #d97757; letter-spacing: .5px; }
      .n { font: 600 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #f5f4ee; }
      .s { font: 400 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #a8a397; }
      .tag { font: 600 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #8f8a7e; }
    </style>
  </defs>

  <rect width="1200" height="390" rx="24" fill="url(#pbg)"/>

  <text x="40" y="52" class="h">plan-feature-into-tickets</text>
  <text x="40" y="78" class="p">From a rough idea to GitHub issues. Nothing changes until you approve.</text>

  <!-- plan mode frames -->
  <rect x="30" y="112" width="852" height="250" rx="14" fill="none" stroke="#3a3732" stroke-dasharray="5 5"/>
  <text x="34" y="104" class="stage">PLAN MODE ON</text>
  <rect x="905" y="112" width="265" height="250" rx="14" fill="none" stroke="#3a3732" stroke-dasharray="5 5">
    <animate attributeName="stroke" values="#3a3732;#3a3732;#8fc79a;#8fc79a;#3a3732" keyTimes="0;0.79;0.80;0.99;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="909" y="104" class="stage">PLAN MODE OFF</text>

  <line x1="165" y1="150" x2="1037" y2="150" stroke="#2f2c28" stroke-width="2"/>

  <!-- subagent arrows: request down, reply up -->
  <path id="exDown" d="M 150 232 L 150 278" fill="none" stroke="#5a554d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path id="exUp" d="M 180 278 L 180 232" fill="none" stroke="#5a554d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path id="drDown" d="M 425 232 L 425 278" fill="none" stroke="#5a554d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path id="drUp" d="M 455 278 L 455 232" fill="none" stroke="#5a554d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- phases -->
  <g>
    <rect x="50" y="150" width="230" height="80" rx="12" fill="#2b2925" stroke="#3a3732" stroke-width="1.5">
      <animate attributeName="stroke" values="#3a3732;#d97757;#d97757;#3a3732;#3a3732" keyTimes="0;0.01;0.18;0.20;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="182" class="n">1 · Brainstorm</text>
    <text x="70" y="208" class="s">questions → spec</text>
  </g>
  <g>
    <rect x="330" y="150" width="220" height="80" rx="12" fill="#2b2925" stroke="#3a3732" stroke-width="1.5">
      <animate attributeName="stroke" values="#3a3732;#3a3732;#d97757;#d97757;#3a3732;#3a3732" keyTimes="0;0.20;0.21;0.45;0.47;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="350" y="182" class="n">2 · Draft</text>
    <text x="350" y="208" class="s">spec → tickets</text>
  </g>
  <g>
    <rect x="600" y="150" width="260" height="80" rx="12" fill="#2b2925" stroke="#3a3732" stroke-width="1.5">
      <animate attributeName="stroke" values="#3a3732;#3a3732;#d97757;#d97757;#3a3732;#3a3732" keyTimes="0;0.47;0.48;0.75;0.77;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="620" y="182" class="n">3 · Review</text>
    <text x="620" y="208" class="s">you check each ticket</text>
  </g>
  <g>
    <rect x="925" y="150" width="225" height="80" rx="12" fill="#2b2925" stroke="#3a3732" stroke-width="1.5">
      <animate attributeName="stroke" values="#3a3732;#3a3732;#8fc79a;#8fc79a;#3a3732" keyTimes="0;0.79;0.80;0.99;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#2b2925;#2b2925;#22302a;#22302a;#2b2925" keyTimes="0;0.79;0.80;0.99;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="945" y="182" class="n">4 · Create</text>
    <text x="945" y="208" class="s">pushes issues to GitHub ✅</text>
  </g>

  <!-- subagents -->
  <g>
    <rect x="50" y="280" width="230" height="56" rx="12" fill="#2b2925" stroke="#3a3732" stroke-width="1.5">
      <animate attributeName="stroke" values="#3a3732;#3a3732;#d97757;#d97757;#3a3732;#3a3732" keyTimes="0;0.06;0.07;0.13;0.15;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="165" y="313" text-anchor="middle" class="n">explorers ×3</text>
  </g>
  <g>
    <rect x="330" y="280" width="220" height="56" rx="12" fill="#2b2925" stroke="#3a3732" stroke-width="1.5">
      <animate attributeName="stroke" values="#3a3732;#3a3732;#d97757;#d97757;#3a3732;#3a3732" keyTimes="0;0.25;0.26;0.40;0.42;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="313" text-anchor="middle" class="n">ticket-drafter</text>
  </g>

  <!-- your two gates -->
  <rect x="285" y="139" width="40" height="22" rx="11" fill="#2b2925" stroke="#3a3732" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a3732;#3a3732;#d97757;#d97757;#3a3732;#3a3732" keyTimes="0;0.17;0.18;0.22;0.24;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="305" y="154" text-anchor="middle" class="tag" style="fill:#f5f4ee">yes</text>
  <rect x="863" y="139" width="60" height="22" rx="11" fill="#2b2925" stroke="#3a3732" stroke-width="1.5">
    <animate attributeName="stroke" values="#3a3732;#3a3732;#8fc79a;#8fc79a;#3a3732;#3a3732" keyTimes="0;0.74;0.75;0.80;0.82;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <text x="893" y="154" text-anchor="middle" class="tag" style="fill:#f5f4ee">approve</text>

  <!-- the work moving through the phases -->
  <circle r="11" fill="url(#pglow)">
    <animateMotion path="M 165 150 L 1037 150" keyPoints="0;0;0.3154;0.3154;0.6479;0.6479;1;1" keyTimes="0;0.18;0.21;0.45;0.48;0.75;0.80;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- sparks: down to the subagents, replies back up -->
  <circle r="5" fill="#ffb08f" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.03;0.07;1" calcMode="linear"><mpath href="#exDown" xlink:href="#exDown"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.029;0.031;0.069;0.07;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#ffb08f" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.13;0.17;1" calcMode="linear"><mpath href="#exUp" xlink:href="#exUp"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.129;0.131;0.169;0.17;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#ffb08f" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.22;0.26;1" calcMode="linear"><mpath href="#drDown" xlink:href="#drDown"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.219;0.221;0.259;0.26;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#ffb08f" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.40;0.44;1" calcMode="linear"><mpath href="#drUp" xlink:href="#drUp"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.399;0.401;0.439;0.44;1" dur="12s" repeatCount="indefinite"/>
  </circle>
</svg>
